<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拾光集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<div class="app">

  <header class="app-header">
    <div class="brand">
      <div class="brand-text">
        <h1>拾光集</h1>
        <p>一张图，一句话</p>
      </div>
    </div>
    <button id="settingsBtn" class="icon-btn" title="设置">⚙</button>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="write">写一条</button>
    <button class="tab-btn" data-tab="gallery">回顾</button>
  </nav>

  <section id="tab-write" class="tab-panel active">
    <form id="entryForm" class="entry-form">
      <label class="upload-zone" id="uploadZone">
        <input type="file" id="imageInput" accept="image/*" hidden>
        <div id="uploadPlaceholder" class="upload-placeholder">
          <span class="upload-icon">＋</span>
          <span>选一张今天的图</span>
        </div>
        <img id="imagePreview" class="image-preview" hidden>
      </label>

      <textarea id="captionInput" class="caption-input" placeholder="写下这一刻……" maxlength="120" rows="2"></textarea>
      <div class="char-count"><span id="charCount">0</span>/120</div>

      <button type="submit" id="saveBtn" class="save-btn">存下来</button>
      <p id="statusMsg" class="status-msg"></p>
    </form>
  </section>

  <section id="tab-gallery" class="tab-panel">
    <div id="galleryStatus" class="status-msg"></div>
    <div id="galleryGrid" class="gallery-grid"></div>
  </section>

</div>

<!-- 角落干花装饰 -->
<svg class="corner-flower" width="80" height="100" viewBox="0 0 80 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M40 95 L40 45" stroke="#C4A088" stroke-width="1"/>
  <ellipse cx="40" cy="30" rx="12" ry="18" fill="#C4A088" opacity="0.5" transform="rotate(-15 40 30)"/>
  <ellipse cx="40" cy="30" rx="12" ry="18" fill="#C4A088" opacity="0.4" transform="rotate(15 40 30)"/>
  <ellipse cx="40" cy="28" rx="10" ry="16" fill="#C4A088" opacity="0.35" transform="rotate(-40 40 28)"/>
  <ellipse cx="40" cy="28" rx="10" ry="16" fill="#C4A088" opacity="0.3" transform="rotate(40 40 28)"/>
  <ellipse cx="40" cy="26" rx="8" ry="14" fill="#C4A088" opacity="0.25" transform="rotate(-65 40 26)"/>
  <ellipse cx="40" cy="26" rx="8" ry="14" fill="#C4A088" opacity="0.2" transform="rotate(65 40 26)"/>
  <circle cx="40" cy="30" r="4" fill="#A8836B" opacity="0.5"/>
  <path d="M38 50 Q30 60 25 75" stroke="#C4A088" stroke-width="0.5" opacity="0.4" fill="none"/>
  <path d="M42 55 Q50 62 55 72" stroke="#C4A088" stroke-width="0.5" opacity="0.4" fill="none"/>
</svg>

<!-- 设置弹层 -->
<div id="settingsModal" class="modal-overlay" hidden>
  <div class="modal">
    <h2>连接你的仓库</h2>
    <p class="modal-hint">内容存进你自己的 GitHub 仓库，Token 只留在这台设备。</p>
    <label>GitHub 用户名<input type="text" id="ownerInput" placeholder="例如 yiyi-chen"></label>
    <label>仓库名<input type="text" id="repoInput" placeholder="例如 aesthetic-journal"></label>
    <label>分支<input type="text" id="branchInput" placeholder="main" value="main"></label>
    <label>Personal Access Token
      <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxx">
    </label>
    <p class="modal-hint small">Token 需要 Contents 读写权限。</p>
    <div class="modal-actions">
      <button id="cancelSettings" class="ghost-btn">取消</button>
      <button id="saveSettings" class="save-btn">保存</button>
    </div>
  </div>
</div>

<script src="app.js?v=3"></script>
</body>
</html>
