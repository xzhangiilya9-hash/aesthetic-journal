<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>拾光集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Liu+Jian+Mao+Cao&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>

<!-- ══ 远景装饰：模糊、低透明，造空间纵深 ══ -->
<div class="flora far"><img src="assets/flower2/07-spray-amber.png" alt=""></div>
<div class="flora mid"><img src="assets/flower2/12-blossom-cream.png" alt=""></div>

<header class="top">
  <h1 class="brand">拾光集</h1>
  <button id="settingsBtn" class="icon-btn" title="设置" aria-label="设置">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
</header>

<!-- ══ 信堆 ══ -->
<main class="stage">
  <div class="stack-wrap">
    <!-- 从信堆背后长出来的干花 -->
    <div class="flora behind-l"><img src="assets/flower2/10-ranunculus-white.png" alt=""></div>
    <div class="flora behind-r"><img src="assets/flower2/07-spray-amber.png" alt=""></div>
    <div class="flora behind-b"><img src="assets/flower2/08-sprig-rust.png" alt=""></div>

    <div class="stack" id="stack"></div>

    <!-- 空 / 加载 / 未配置 状态 -->
    <div class="stage-note" id="stageNote" hidden></div>
  </div>
</main>

<div class="flora near"><img src="assets/flower2/11-poppy-red.png" alt=""></div>

<p class="counter" id="counter"></p>

<nav class="dock">
  <button class="pill" id="resetBtn" hidden>回到最上面</button>
  <button class="pill solid" id="composeBtn">写一条</button>
</nav>

<!-- ══ 写一条 ══ -->
<div class="sheet-mask" id="composeSheet" hidden>
  <form class="sheet" id="entryForm">
    <div class="sheet-head">
      <h2>写一条</h2>
      <button type="button" class="icon-btn" id="closeCompose" aria-label="关闭">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <label class="drop" id="dropZone">
      <input type="file" id="imageInput" accept="image/*" hidden>
      <div class="drop-empty" id="dropEmpty">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="m21 15-5-5L5 21"/>
        </svg>
        <span>选一张今天的图</span>
      </div>
      <img id="imagePreview" class="drop-preview" hidden alt="">
    </label>

    <textarea id="captionInput" class="caption" rows="2" maxlength="120"
              placeholder="写下这一刻……"></textarea>
    <div class="char"><span id="charCount">0</span>/120</div>

    <button type="submit" class="pill solid wide" id="saveBtn">存下来</button>
    <p class="msg" id="statusMsg"></p>
  </form>
</div>

<!-- ══ 设置 ══ -->
<div class="sheet-mask" id="settingsModal" hidden>
  <form class="sheet" id="settingsForm">
    <div class="sheet-head">
      <h2>连接你的仓库</h2>
      <button type="button" class="icon-btn" id="cancelSettings" aria-label="关闭">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <p class="hint">内容存进你自己的 GitHub 仓库，Token 只留在这台设备。</p>

    <label class="field">GitHub 用户名
      <input type="text" id="ownerInput" placeholder="例如 xzhangiilya9-hash" autocomplete="off">
    </label>
    <label class="field">仓库名
      <input type="text" id="repoInput" placeholder="例如 aesthetic-journal" autocomplete="off">
    </label>
    <label class="field">分支
      <input type="text" id="branchInput" placeholder="main" value="main" autocomplete="off">
    </label>
    <label class="field">Personal Access Token
      <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off">
    </label>
    <p class="hint small">Token 需要 Contents 读写权限。</p>

    <button type="submit" class="pill solid wide" id="saveSettings">保存</button>
    <p class="msg" id="settingsMsg"></p>
  </form>
</div>

<script src="app.js?v=5"></script>
</body>
</html>
